name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            host: x86_64-pc-linux-gnu
          - name: linux-arm64
            os: ubuntu-22.04-arm
            host: aarch64-linux-gnu
          - name: macos-arm64        # Apple Silicon
            os: macos-14
            host: ""                 # detected via config.guess
          - name: macos-x86_64       # Intel
            os: macos-15-intel
            host: ""
          - name: windows-x86        # 32-bit, cross-compiled from Linux
            os: ubuntu-22.04
            host: i686-w64-mingw32

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # ---------- Build tools ----------
      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libtool autotools-dev automake pkg-config \
            bsdmainutils curl git python3 patch bison gperf cmake ca-certificates zip
          if [ "${{ matrix.name }}" = "windows-x86" ]; then
            sudo apt-get install -y g++-mingw-w64-i686 mingw-w64-i686-dev nsis
            # depends needs the posix threading flavour of MinGW
            sudo update-alternatives --set i686-w64-mingw32-g++ /usr/bin/i686-w64-mingw32-g++-posix
            sudo update-alternatives --set i686-w64-mingw32-gcc /usr/bin/i686-w64-mingw32-gcc-posix
          fi

      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: brew install automake libtool pkg-config coreutils python3 gnu-tar

      # ---------- Resolve host triple ----------
      - name: Check repo has depends/
        run: |
          if [ ! -d depends ]; then
            echo "::error::No depends/ directory found. Cannot build bundled Qt + BDB 4.8."
            exit 1
          fi
          HOST="${{ matrix.host }}"
          if [ -z "$HOST" ]; then HOST="$(./depends/config.guess)"; fi
          echo "HOST=$HOST" >> "$GITHUB_ENV"
          echo "Using HOST=$HOST"

      # ---------- Cache the (slow) dependency build ----------
      - name: Cache depends
        uses: actions/cache@v4
        with:
          path: |
            depends/built
            depends/sources
          key: depends-${{ matrix.name }}-${{ hashFiles('depends/packages/**', 'depends/Makefile', 'depends/*.mk') }}
          restore-keys: depends-${{ matrix.name }}-

      # ---------- Build dependencies (Qt 5, Berkeley DB 4.8, Boost, ...) ----------
      - name: Build depends
        run: |
          JOBS="$(nproc 2>/dev/null || sysctl -n hw.ncpu)"
          make -C depends HOST="$HOST" -j"$JOBS"

      # ---------- Build wallet ----------
      - name: Configure
        run: |
          ./autogen.sh
          EXTRA=""
          case "${{ matrix.name }}" in
            linux-*)
              EXTRA="--enable-glibc-back-compat --enable-reduce-exports LDFLAGS=-static-libstdc++" ;;
            windows-*)
              EXTRA="--enable-reduce-exports" ;;
            macos-*)
              EXTRA="--enable-reduce-exports" ;;
          esac
          CONFIG_SITE="$PWD/depends/$HOST/share/config.site" ./configure \
            --prefix=/ \
            --with-gui=qt5 \
            --disable-tests --disable-bench \
            $EXTRA

      - name: Compile
        run: make -j"$(nproc 2>/dev/null || sysctl -n hw.ncpu)"

      - name: Install to dist/
        run: |
          mkdir -p dist
          make install DESTDIR="$PWD/dist"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Masternoder2-${{ matrix.name }}
          path: dist/
          if-no-files-found: error
