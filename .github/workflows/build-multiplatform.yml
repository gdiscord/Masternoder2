name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            host: x86_64-pc-linux-gnu
          - name: linux-arm64
            os: ubuntu-22.04-arm
            host: aarch64-linux-gnu
          - name: macos-arm64        # Apple Silicon
            os: macos-14
            host: ""
          - name: macos-x86_64       # Intel
            os: macos-15-intel
            host: ""
          - name: windows-x86        # 32-bit, cross-compiled from Linux (needs depends/)
            os: ubuntu-22.04
            host: i686-w64-mingw32

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # ---------- Diagnose repo layout ----------
      - name: Detect depends/ system
        run: |
          echo "--- repo root ---"; ls -la
          echo "--- depends/ ---"; ls -la depends 2>&1 || true
          if [ -f depends/Makefile ]; then
            echo "USE_DEPENDS=true" >> "$GITHUB_ENV"
            HOST="${{ matrix.host }}"
            if [ -z "$HOST" ]; then HOST="$(./depends/config.guess)"; fi
            echo "HOST=$HOST" >> "$GITHUB_ENV"
          else
            echo "USE_DEPENDS=false" >> "$GITHUB_ENV"
            echo "::warning::depends/Makefile not found; using system Qt + BDB 4.8 built from source"
            if [ "${{ matrix.name }}" = "windows-x86" ]; then
              echo "::error::Windows cross-build needs a working depends/ directory. Copy it from the upstream project this is forked from."
              exit 1
            fi
          fi

      # ---------- Build tools ----------
      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libtool autotools-dev automake pkg-config \
            bsdmainutils curl git python3 patch bison gperf cmake ca-certificates zip
          if [ "${{ matrix.name }}" = "windows-x86" ]; then
            sudo apt-get install -y g++-mingw-w64-i686 mingw-w64-i686-dev nsis
            sudo update-alternatives --set i686-w64-mingw32-g++ /usr/bin/i686-w64-mingw32-g++-posix
            sudo update-alternatives --set i686-w64-mingw32-gcc /usr/bin/i686-w64-mingw32-gcc-posix
          fi

      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: brew install automake libtool pkg-config coreutils python3 gnu-tar

      # =====================================================================
      # Path A: repo has a working depends/ (static Qt + BDB 4.8 + libs)
      # =====================================================================
      - name: Cache depends
        if: env.USE_DEPENDS == 'true'
        uses: actions/cache@v4
        with:
          path: |
            depends/built
            depends/sources
          key: depends-${{ matrix.name }}-${{ hashFiles('depends/packages/**', 'depends/Makefile', 'depends/*.mk') }}
          restore-keys: depends-${{ matrix.name }}-

      - name: Build depends
        if: env.USE_DEPENDS == 'true'
        run: make -C depends HOST="$HOST" -j"$(nproc 2>/dev/null || sysctl -n hw.ncpu)"

      - name: Configure (depends)
        if: env.USE_DEPENDS == 'true'
        run: |
          ./autogen.sh
          EXTRA="--enable-reduce-exports"
          case "${{ matrix.name }}" in
            linux-*) EXTRA="$EXTRA --enable-glibc-back-compat LDFLAGS=-static-libstdc++" ;;
          esac
          CONFIG_SITE="$PWD/depends/$HOST/share/config.site" ./configure \
            --prefix=/ --with-gui=qt5 --disable-tests --disable-bench $EXTRA

      # =====================================================================
      # Path B: no depends/ -> system Qt 5 + BDB 4.8 built from source
      # =====================================================================
      - name: Install libraries (Linux)
        if: env.USE_DEPENDS == 'false' && runner.os == 'Linux'
        run: |
          sudo apt-get install -y libboost-all-dev libevent-dev libssl-dev \
            libminiupnpc-dev libzmq3-dev libgmp-dev libsodium-dev \
            qtbase5-dev qttools5-dev qttools5-dev-tools libqrencode-dev \
            libprotobuf-dev protobuf-compiler

      - name: Install libraries (macOS)
        if: env.USE_DEPENDS == 'false' && runner.os == 'macOS'
        run: |
          brew install boost libevent openssl@3 miniupnpc zeromq gmp libsodium \
            qt@5 qrencode protobuf

      - name: Cache Berkeley DB 4.8
        if: env.USE_DEPENDS == 'false'
        id: bdbcache
        uses: actions/cache@v4
        with:
          path: ~/bdb48
          key: bdb48-${{ matrix.name }}-v1

      - name: Build Berkeley DB 4.8
        if: env.USE_DEPENDS == 'false' && steps.bdbcache.outputs.cache-hit != 'true'
        run: |
          set -e
          cd "$RUNNER_TEMP"
          curl -fL --retry 5 --retry-delay 5 -o db-4.8.30.NC.tar.gz \
            https://download.oracle.com/berkeley-db/db-4.8.30.NC.tar.gz
          echo "12edc0df75bf9abd7f82f821795bcee50f42cb2e5f76a6a281b85732798364ef  db-4.8.30.NC.tar.gz" | shasum -a 256 -c -
          tar xzf db-4.8.30.NC.tar.gz
          chmod -R u+w db-4.8.30.NC
          cd db-4.8.30.NC

          # Rename __atomic_compare_exchange (clashes with compiler builtin on modern GCC/Clang)
          sed -i.bak 's/__atomic_compare_exchange/__atomic_compare_exchange_db/g' \
            dbinc/atomic.h mp/mp_fget.c mp/mp_mvcc.c mp/mp_region.c \
            mutex/mut_method.c mutex/mut_tas.c

          # Old config.guess/sub don't know aarch64 / arm64: use the ones from local automake
          BREW_PREFIX="$(brew --prefix 2>/dev/null || true)"
          for f in config.guess config.sub; do
            src="$(ls /usr/share/automake-*/$f ${BREW_PREFIX:+$BREW_PREFIX/share/automake-*/$f} 2>/dev/null | head -n1 || true)"
            if [ -z "$src" ]; then echo "::error::could not find $f from automake"; exit 1; fi
            cp "$src" dist/$f
          done

          cd build_unix
          ../dist/configure --enable-cxx --disable-shared --disable-replication \
            --with-pic --prefix="$HOME/bdb48"
          make -j"$(nproc 2>/dev/null || sysctl -n hw.ncpu)"
          make install

      - name: Cache OpenSSL 1.1.1
        if: env.USE_DEPENDS == 'false'
        id: ssl_cache
        uses: actions/cache@v4
        with:
          path: ~/openssl111
          key: openssl111w-${{ matrix.name }}-v1

      - name: Build OpenSSL 1.1.1w (project rejects OpenSSL 3)
        if: env.USE_DEPENDS == 'false' && steps.ssl_cache.outputs.cache-hit != 'true'
        run: |
          set -e
          cd "$RUNNER_TEMP"
          curl -fL --retry 5 --retry-delay 5 -o openssl.tar.gz \
            https://github.com/openssl/openssl/releases/download/OpenSSL_1_1_1w/openssl-1.1.1w.tar.gz \
            || curl -fL --retry 5 --retry-delay 5 -o openssl.tar.gz \
            https://www.openssl.org/source/openssl-1.1.1w.tar.gz
          echo "cf3098950cb4d853ad95c0841f1f9c6d3dc102dccfcacd521d93925208b76ac8  openssl.tar.gz" | shasum -a 256 -c -
          tar xzf openssl.tar.gz
          cd openssl-1.1.1w
          ./config no-shared no-tests -fPIC --prefix="$HOME/openssl111" --openssldir="$HOME/openssl111" --libdir=lib
          make -j"$(nproc 2>/dev/null || sysctl -n hw.ncpu)"
          make install_sw

      - name: Configure (system libs)
        if: env.USE_DEPENDS == 'false'
        run: |
          set -e
          ./autogen.sh
          SSL="$HOME/openssl111"
          export BDB_CFLAGS="-I$HOME/bdb48/include"
          export BDB_LIBS="-L$HOME/bdb48/lib -ldb_cxx-4.8"
          export PKG_CONFIG_PATH="$SSL/lib/pkgconfig:$PKG_CONFIG_PATH"
          export CPPFLAGS="-I$SSL/include"
          export LDFLAGS="-L$SSL/lib"
          if [ "${{ runner.os }}" = "macOS" ]; then
            P="$(brew --prefix)"
            export PATH="$(brew --prefix qt@5)/bin:$PATH"
            export PKG_CONFIG_PATH="$PKG_CONFIG_PATH:$(brew --prefix qt@5)/lib/pkgconfig"
            export CPPFLAGS="$CPPFLAGS -I$P/include"
            export LDFLAGS="$LDFLAGS -L$P/lib"
          fi
          echo "=== OpenSSL we built ==="
          grep -h "OPENSSL_VERSION_TEXT" "$SSL/include/openssl/opensslv.h" | head -n1 || true
          ls -la "$SSL/lib" || true
          echo "=== SSL checks in the project's configure.ac ==="
          grep -rn -B6 -A6 "unsupported SSL" configure.ac build-aux/m4 2>/dev/null || true
          echo "=== pkg-config view of libcrypto ==="
          pkg-config --modversion libcrypto || true
          pkg-config --cflags --libs libcrypto || true
          ./configure --prefix=/ --with-gui=qt5 --disable-tests --disable-bench || {
            echo "=== configure failed: RAND_egd link test from config.log ==="
            awk '/checking for RAND_egd in -lcrypto/{f=1} f{print} f&&/result:/{exit}' config.log | head -n 60
            exit 1
          }

      # =====================================================================
      # Common: compile + package
      # =====================================================================
      - name: Compile
        run: make -j"$(nproc 2>/dev/null || sysctl -n hw.ncpu)"

      - name: Install to dist/
        run: |
          mkdir -p dist
          make install DESTDIR="$PWD/dist"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Masternoder2-${{ matrix.name }}
          path: dist/
          if-no-files-found: error